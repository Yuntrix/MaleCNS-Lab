<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Behavior Arbiter</title><desc id="desc">Priority, ownership and graceful preemption</desc>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#171927" stroke-width="1"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker></defs>
<rect width="100%" height="100%" fill="#080910"/><rect width="100%" height="100%" fill="url(#grid)"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f4fa}.t{font-size:34px;font-weight:800}.s{font-size:16px;fill:#aaa6bc}.k{font-size:13px;font-weight:800;letter-spacing:1px}.h{font-size:19px;font-weight:800}.b{font-size:15px}.m{font-size:13px;fill:#aaa6bc}.panel{fill:#141824;stroke:#3a4158;stroke-width:1.2}.line{stroke:#8b5cf6;stroke-width:2;fill:none}.dash{stroke:#3a4158;stroke-width:2;fill:none;stroke-dasharray:7 7}</style><text x="52" y="58" class="t">Behavior Arbiter</text><text x="52" y="84" class="s">Priority, ownership and graceful preemption</text><rect x="52.0" y="122" width="346.6666666666667" height="180" rx="18" fill="#141824" stroke="#ff6673" stroke-width="1.5"/><text x="72.0" y="156" class="h" fill="#ff6673" style="fill:#ff6673">PRIORITY 300</text><text x="72.0" y="190" class="m">Kicks events</text><text x="72.0" y="215" class="m">Highest behavior ownership</text><text x="72.0" y="240" class="m">Interrupts daily life</text><rect x="426.6666666666667" y="122" width="346.6666666666667" height="180" rx="18" fill="#141824" stroke="#ffbd2e" stroke-width="1.5"/><text x="446.6666666666667" y="156" class="h" fill="#ffbd2e" style="fill:#ffbd2e">PRIORITY 200</text><text x="446.6666666666667" y="190" class="m">Subscriber commands</text><text x="446.6666666666667" y="215" class="m">Whitelist + cooldown</text><text x="446.6666666666667" y="240" class="m">Reject on low energy</text><rect x="801.3333333333334" y="122" width="346.6666666666667" height="180" rx="18" fill="#141824" stroke="#2dd4a7" stroke-width="1.5"/><text x="821.3333333333334" y="156" class="h" fill="#2dd4a7" style="fill:#2dd4a7">PRIORITY 100</text><text x="821.3333333333334" y="190" class="m">Daily life</text><text x="821.3333333333334" y="215" class="m">State-driven selection</text><text x="821.3333333333334" y="240" class="m">Autonomous routines</text><rect x="52.0" y="328" width="346.6666666666667" height="180" rx="18" fill="#141824" stroke="#8b5cf6" stroke-width="1.5"/><text x="72.0" y="362" class="h" fill="#8b5cf6" style="fill:#8b5cf6">LIFECYCLE</text><text x="72.0" y="396" class="m">ENTER → ACTIVE</text><text x="72.0" y="421" class="m">CANCEL_REQUESTED</text><text x="72.0" y="446" class="m">TRANSITION_OUT → CLEANUP → DONE</text><rect x="426.6666666666667" y="328" width="346.6666666666667" height="180" rx="18" fill="#141824" stroke="#63a8ff" stroke-width="1.5"/><text x="446.6666666666667" y="362" class="h" fill="#63a8ff" style="fill:#63a8ff">OWNERSHIP</text><text x="446.6666666666667" y="396" class="m">Current behavior</text><text x="446.6666666666667" y="421" class="m">Pending behavior</text><text x="446.6666666666667" y="446" class="m">Body + prop ownership</text><rect x="801.3333333333334" y="328" width="346.6666666666667" height="180" rx="18" fill="#141824" stroke="#eb6db6" stroke-width="1.5"/><text x="821.3333333333334" y="362" class="h" fill="#eb6db6" style="fill:#eb6db6">CONTEXT ROUTE</text><text x="821.3333333333334" y="396" class="m">Separate commands</text><text x="821.3333333333334" y="421" class="m">No automatic full ownership</text><text x="821.3333333333334" y="446" class="m">Preserve active behavior</text></svg>