<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker></defs>
<rect width="100%" height="100%" fill="#080910"/><rect width="100%" height="100%" fill="url(#grid)"/>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f4f4fa}.t{font-size:34px;font-weight:800}.s{font-size:16px;fill:#aaa6bc}.k{font-size:13px;font-weight:800;letter-spacing:1px}.h{font-size:19px;font-weight:800}.b{font-size:15px}.m{font-size:13px;fill:#aaa6bc}.panel{fill:#141824;stroke:#3a4158;stroke-width:1.2}.line{stroke:#8b5cf6;stroke-width:2;fill:none}.dash{stroke:#3a4158;stroke-width:2;fill:none;stroke-dasharray:7 7}</style><text x="52" y="58" class="t">OBS FLY / LIFE MONITOR</text><text x="52" y="84" class="s">Concept UI · illustrative values · planned runtime state</text><rect x="52" y="118" width="1096" height="430" rx="22" fill="#141824" stroke="#8b5cf6" stroke-width="1.5"/><text x="82" y="160" class="k" fill="#8b5cf6" style="fill:#8b5cf6">CURRENT BEHAVIOR</text><text x="82" y="187" class="h">WATCHING</text><text x="82" y="227" class="k" fill="#8b5cf6" style="fill:#8b5cf6">PHASE</text><text x="82" y="254" class="h">ACTIVE</text><text x="82" y="294" class="k" fill="#8b5cf6" style="fill:#8b5cf6">ANIMATION</text><text x="82" y="321" class="h">FLY_WATCHING_IDLE</text><text x="82" y="361" class="k" fill="#8b5cf6" style="fill:#8b5cf6">SUPPORT</text><text x="82" y="388" class="h">WEBCAM</text><text x="82" y="428" class="k" fill="#8b5cf6" style="fill:#8b5cf6">COLLISION</text><text x="82" y="455" class="h">GROUNDED</text><text x="430" y="157" class="k">ENERGY</text><rect x="600" y="143" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="143" width="302.4" height="18" rx="9" fill="#2dd4a7"/><text x="1062" y="157" class="k" fill="#aaa6bc" style="fill:#aaa6bc">72%</text><text x="430" y="207" class="k">HUNGER</text><rect x="600" y="193" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="193" width="214.2" height="18" rx="9" fill="#ffbd2e"/><text x="1062" y="207" class="k" fill="#aaa6bc" style="fill:#aaa6bc">51%</text><text x="430" y="257" class="k">SLEEP / RECOVERY</text><rect x="600" y="243" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="243" width="310.8" height="18" rx="9" fill="#63a8ff"/><text x="1062" y="257" class="k" fill="#aaa6bc" style="fill:#aaa6bc">74%</text><text x="430" y="307" class="k">MOOD</text><rect x="600" y="293" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="293" width="344.4" height="18" rx="9" fill="#eb6db6"/><text x="1062" y="307" class="k" fill="#aaa6bc" style="fill:#aaa6bc">82%</text><text x="430" y="357" class="k">STRENGTH</text><rect x="600" y="343" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="343" width="184.8" height="18" rx="9" fill="#8b5cf6"/><text x="1062" y="357" class="k" fill="#aaa6bc" style="fill:#aaa6bc">44%</text><text x="430" y="407" class="k">STRESS / AROUSAL</text><rect x="600" y="393" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="393" width="109.2" height="18" rx="9" fill="#ff6673"/><text x="1062" y="407" class="k" fill="#aaa6bc" style="fill:#aaa6bc">26%</text><text x="430" y="457" class="k">BOREDOM</text><rect x="600" y="443" width="420" height="18" rx="9" fill="#2a3246"/><rect x="600" y="443" width="79.8" height="18" rx="9" fill="#baf7d5"/><text x="1062" y="457" class="k" fill="#aaa6bc" style="fill:#aaa6bc">19%</text><text x="430" y="520" class="m">Food → hunger ↓ / energy ↑   ·   Sleep → fatigue ↓ / energy ↑   ·   Training → conditioning ↑</text></svg>